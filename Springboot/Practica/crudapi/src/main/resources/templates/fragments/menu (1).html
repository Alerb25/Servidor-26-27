<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- ===== HEAD común ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Clínica DAW'">Clínica DAW</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>

<!-- ===== MENÚ SUPERIOR ===== -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-heart-pulse-fill me-1"></i> Clínica DAW
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'pacientes'} ? 'active'" th:href="@{/pacientes}">
                        <i class="bi bi-people"></i> Pacientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'citas'} ? 'active'" th:href="@{/citas}">
                        <i class="bi bi-calendar-check"></i> Citas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'busqueda'} ? 'active'" th:href="@{/busqueda}">
                        <i class="bi bi-search"></i> Búsqueda avanzada</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'estadisticas'} ? 'active'" th:href="@{/estadisticas}">
                        <i class="bi bi-bar-chart"></i> Estadísticas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'logs'} ? 'active'" th:href="@{/logs}">
                        <i class="bi bi-journal-text"></i> Logs</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ===== MENSAJES FLASH ===== -->
<div th:fragment="alertas">
    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle"></i> <span th:text="${mensaje}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ===== PAGINACIÓN ===== -->
<nav th:fragment="paginacion(page, url)" th:if="${page.totalPages > 1}">
    <ul class="pagination justify-content-center mb-0">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number - 1}, size=${page.size})}">&laquo;</a>
        </li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{${url}(page=${i}, size=${page.size})}" th:text="${i + 1}">1</a>
        </li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number + 1}, size=${page.size})}">&raquo;</a>
        </li>
    </ul>
</nav>

<!-- ===== SELECTOR DE ELEMENTOS POR PÁGINA ===== -->
<form th:fragment="tamano(page, url)" th:action="@{${url}}" method="get" class="d-flex align-items-center gap-2">
    <input type="hidden" name="page" value="0">
    <label class="form-label mb-0 small text-muted">Por página</label>
    <select name="size" class="form-select form-select-sm w-auto" onchange="this.form.submit()">
        <option th:each="n : ${ {5, 10, 25, 50} }" th:value="${n}" th:text="${n}" th:selected="${n == page.size}"></option>
    </select>
</form>

<!-- ===== MODAL DE CONFIRMACIÓN + SCRIPTS ===== -->
<div th:fragment="scripts">
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="confirmMsg">¿Seguro que quieres eliminar este elemento?</div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <a id="confirmBtn" class="btn btn-danger" href="#"><i class="bi bi-trash"></i> Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Botones con data-bs-target="#confirmModal":
        //   data-msg  -> texto a mostrar
        //   data-href -> enlace a seguir al confirmar (GET)
        //   data-form -> id de un formulario (POST) a enviar al confirmar
        const confirmModal = document.getElementById('confirmModal');
        const confirmBtn = document.getElementById('confirmBtn');
        confirmModal.addEventListener('show.bs.modal', function (ev) {
            const origen = ev.relatedTarget;
            document.getElementById('confirmMsg').textContent = origen.dataset.msg || '¿Seguro?';
            confirmBtn.dataset.form = origen.dataset.form || '';
            confirmBtn.setAttribute('href', origen.dataset.href || '#');
        });
        confirmBtn.addEventListener('click', function (e) {
            const formId = confirmBtn.dataset.form;
            if (formId) {
                e.preventDefault();
                document.getElementById(formId).submit();
            }
        });
    </script>
</div>

</body>
</html>
