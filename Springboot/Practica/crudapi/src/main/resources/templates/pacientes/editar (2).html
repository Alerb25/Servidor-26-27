<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Paciente')}"></head>
<body>
<nav th:replace="~{fragments/menu :: navbar('pacientes')}"></nav>
<div class="container" style="max-width: 720px;">
    <h2 class="mb-3">
        <i class="bi bi-person-plus"></i>
        Editar paciente
    </h2>

    <form class="card card-body shadow-sm" method="post" th:object="${paciente}"
          th:action="@{/pacientes/modificar}">
        <input type="hidden" th:field="*{idPaciente}">

        <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <input type="text" class="form-control" th:field="*{nombreCompleto}"
                   th:classappend="${#fields.hasErrors('nombreCompleto')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{nombreCompleto}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Fecha de nacimiento</label>
                <input type="date" class="form-control" th:field="*{fechaNacimiento}"
                       th:classappend="${#fields.hasErrors('fechaNacimiento')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{fechaNacimiento}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Grupo sanguíneo</label>
                <select class="form-select" th:field="*{grupoSanguineo}"
                        th:classappend="${#fields.hasErrors('grupoSanguineo')} ? 'is-invalid'">
                    <option value="">-- Selecciona --</option>
                    <option th:each="g : ${grupos}" th:value="${g}" th:text="${g}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{grupoSanguineo}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Dirección</label>
            <input type="text" class="form-control" th:field="*{direccion}"
                   th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{direccion}"></div>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" th:href="@{/pacientes}"><i class="bi bi-arrow-left"></i> Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
        </div>
    </form>
</div>
<div th:replace="~{fragments/menu :: scripts}"></div>
</body>
</html>
