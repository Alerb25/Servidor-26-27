<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Pacientes')}"></head>
<body>
<nav th:replace="~{fragments/menu :: navbar('pacientes')}"></nav>
<div class="container">
    <div th:replace="~{fragments/menu :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <h2 class="mb-0"><i class="bi bi-people"></i> Pacientes</h2>
        <div class="d-flex gap-2 flex-wrap">
            <div class="btn-group">
                <a class="btn btn-outline-success" th:href="@{/pacientes/exportar/csv}"><i class="bi bi-filetype-csv"></i> CSV</a>
                <a class="btn btn-outline-danger" th:href="@{/pacientes/exportar/pdf}"><i class="bi bi-file-earmark-pdf"></i> PDF</a>
            </div>
            <a class="btn btn-primary" th:href="@{/pacientes/nuevo}"><i class="bi bi-plus-lg"></i> Nuevo paciente</a>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>ID</th><th>Nombre</th><th>Nacimiento</th><th>Dirección</th><th>Grupo</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${pagina.content}">
                    <td th:text="${p.idPaciente}"></td>
                    <td><a th:href="@{/pacientes/detalle/{id}(id=${p.idPaciente})}" class="fw-semibold text-decoration-none"
                           th:text="${p.nombreCompleto}"></a></td>
                    <td th:text="${#temporals.format(p.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                    <td th:text="${p.direccion}"></td>
                    <td><span class="badge text-bg-danger" th:text="${p.grupoSanguineo}"></span></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-secondary" title="Detalle"
                           th:href="@{/pacientes/detalle/{id}(id=${p.idPaciente})}"><i class="bi bi-eye"></i></a>
                        <a class="btn btn-sm btn-outline-primary" title="Editar"
                           th:href="@{/pacientes/editar/{id}(id=${p.idPaciente})}"><i class="bi bi-pencil"></i></a>
                        <button type="button" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                data-bs-toggle="modal" data-bs-target="#confirmModal"
                                th:data-href="@{/pacientes/eliminar/{id}(id=${p.idPaciente})}"
                                th:data-msg="|¿Eliminar al paciente ${p.nombreCompleto}? Sus citas quedarán sin paciente asignado.|">
                            <i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                <tr th:if="${pagina.empty}">
                    <td colspan="6" class="text-center text-muted py-4">No hay pacientes todavía.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="small text-muted" th:text="|${pagina.totalElements} pacientes en total|"></span>
            <div th:replace="~{fragments/menu :: paginacion(${pagina}, '/pacientes')}"></div>
            <form th:replace="~{fragments/menu :: tamano(${pagina}, '/pacientes')}"></form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/menu :: scripts}"></div>
</body>
</html>
