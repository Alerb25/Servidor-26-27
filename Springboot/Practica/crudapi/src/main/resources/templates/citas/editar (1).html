<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Cita')}"></head>
<body>
<nav th:replace="~{fragments/menu :: navbar('citas')}"></nav>
<div class="container" style="max-width: 760px;">
    <h2 class="mb-3">
        <i class="bi bi-calendar-plus"></i>
        Editar cita
    </h2>

    <form class="card card-body shadow-sm" method="post" th:object="${cita}"
          th:action="@{/citas/modificar}">
        <input type="hidden" th:field="*{idCita}">
        <!-- Si venimos del detalle de un paciente, volvemos a él al guardar -->
        <input type="hidden" name="volverPaciente" th:value="${volverPaciente}">

        <div class="mb-3">
            <label class="form-label">Motivo</label>
            <input type="text" class="form-control" th:field="*{motivoCita}"
                   th:classappend="${#fields.hasErrors('motivoCita')} ? 'is-invalid'">
            <div class="invalid-feedback" th:errors="*{motivoCita}"></div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" th:field="*{fecha}"
                       th:classappend="${#fields.hasErrors('fecha')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{fecha}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Estado</label>
                <select class="form-select" th:field="*{estadoCita}"
                        th:classappend="${#fields.hasErrors('estadoCita')} ? 'is-invalid'">
                    <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                </select>
                <div class="invalid-feedback" th:errors="*{estadoCita}"></div>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Paciente</label>
                <select class="form-select" name="pacienteId">
                    <option value="">-- Sin paciente --</option>
                    <option th:each="p : ${pacientes}" th:value="${p.idPaciente}" th:text="${p.nombreCompleto}"
                            th:selected="${pacienteId != null and p.idPaciente == pacienteId}"></option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Duración (minutos)</label>
                <input type="number" min="1" class="form-control" th:field="*{duracionMinutos}"
                       th:classappend="${#fields.hasErrors('duracionMinutos')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{duracionMinutos}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Coste estimado (€)</label>
                <input type="number" step="0.01" min="0" class="form-control" th:field="*{costoEstimado}"
                       th:classappend="${#fields.hasErrors('costoEstimado')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{costoEstimado}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Observaciones</label>
            <textarea class="form-control" rows="3" th:field="*{observaciones}"></textarea>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary"
               th:href="${volverPaciente != null} ? @{/pacientes/detalle/{id}(id=${volverPaciente})} : @{/citas}">
                <i class="bi bi-arrow-left"></i> Cancelar</a>
            <button type="submit" class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
        </div>
    </form>
</div>
<div th:replace="~{fragments/menu :: scripts}"></div>
</body>
</html>
