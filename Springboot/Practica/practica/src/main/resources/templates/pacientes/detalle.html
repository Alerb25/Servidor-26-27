<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Detalle de paciente')}"></head>
<body>
<nav th:replace="~{fragments/menu :: navbar('pacientes')}"></nav>
<div class="container">
    <div th:replace="~{fragments/menu :: alertas}"></div>

    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/pacientes}">Pacientes</a></li>
            <li class="breadcrumb-item active" th:text="${paciente.nombreCompleto}"></li>
        </ol>
    </nav>

    <!-- ===== SECCIÓN SUPERIOR: datos del paciente ===== -->
    <div class="card shadow-sm mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="bi bi-person-vcard"></i> <span th:text="${paciente.nombreCompleto}"></span></h4>
            <div>
                <a class="btn btn-sm btn-outline-primary" th:href="@{/pacientes/editar/{id}(id=${paciente.idPaciente})}">
                    <i class="bi bi-pencil"></i> Editar</a>
                <a class="btn btn-sm btn-secondary" th:href="@{/pacientes}"><i class="bi bi-arrow-left"></i> Volver</a>
            </div>
        </div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">ID</dt>
                <dd class="col-sm-9" th:text="${paciente.idPaciente}"></dd>

                <dt class="col-sm-3">Fecha de nacimiento</dt>
                <dd class="col-sm-9">
                    <span th:text="${#temporals.format(paciente.fechaNacimiento, 'dd/MM/yyyy')}"></span>
                    <span class="text-muted"
                          th:text="|(${T(java.time.Period).between(paciente.fechaNacimiento, T(java.time.LocalDate).now()).years} años)|"></span>
                </dd>

                <dt class="col-sm-3">Dirección</dt>
                <dd class="col-sm-9" th:text="${paciente.direccion}"></dd>

                <dt class="col-sm-3">Grupo sanguíneo</dt>
                <dd class="col-sm-9"><span class="badge text-bg-danger" th:text="${paciente.grupoSanguineo}"></span></dd>

                <dt class="col-sm-3">Número de citas</dt>
                <dd class="col-sm-9" th:text="${#lists.size(citas)}"></dd>
            </dl>
        </div>
    </div>

    <!-- ===== SECCIÓN INFERIOR: citas del paciente ===== -->
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h4 class="mb-0"><i class="bi bi-calendar-check"></i> Citas del paciente</h4>
        <a class="btn btn-primary" th:href="@{/citas/nuevo(pacienteId=${paciente.idPaciente})}">
            <i class="bi bi-plus-lg"></i> Añadir cita</a>
    </div>

    <div class="card shadow-sm mb-5">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Fecha</th><th>Motivo</th><th>Estado</th><th>Duración</th><th>Coste</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${citas}">
                    <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${c.motivoCita}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${c.estadoCita == 'Completada'} ? 'text-bg-success' :
                                              (${c.estadoCita == 'Cancelada'} ? 'text-bg-secondary' :
                                              (${c.estadoCita == 'Confirmada'} ? 'text-bg-info' : 'text-bg-warning'))"
                              th:text="${c.estadoCita}"></span>
                    </td>
                    <td th:text="|${c.duracionMinutos} min|"></td>
                    <td th:text="${#numbers.formatDecimal(c.costoEstimado, 1, 2)} + ' €'"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" title="Editar"
                           th:href="@{/citas/editar/{id}(id=${c.idCita}, volverPaciente=${paciente.idPaciente})}">
                            <i class="bi bi-pencil"></i></a>
                        <form class="d-inline" method="post"
                              th:action="@{/citas/desasociar/{id}(id=${c.idCita}, volverPaciente=${paciente.idPaciente})}">
                            <button class="btn btn-sm btn-outline-warning" title="Desasociar del paciente">
                                <i class="bi bi-link-45deg"></i></button>
                        </form>
                        <button type="button" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                data-bs-toggle="modal" data-bs-target="#confirmModal"
                                th:data-href="@{/citas/eliminar/{id}(id=${c.idCita}, volverPaciente=${paciente.idPaciente})}"
                                th:data-msg="|¿Eliminar la cita '${c.motivoCita}'?|">
                            <i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(citas)}">
                    <td colspan="6" class="text-center text-muted py-4">Este paciente no tiene citas.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<div th:replace="~{fragments/menu :: scripts}"></div>
</body>
</html>
