<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Citas')}"></head>
<body>
<nav th:replace="~{fragments/menu :: navbar('citas')}"></nav>
<div class="container">
    <div th:replace="~{fragments/menu :: alertas}"></div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0"><i class="bi bi-calendar-check"></i> Citas</h2>
        <a class="btn btn-primary" th:href="@{/citas/nuevo}"><i class="bi bi-plus-lg"></i> Nueva cita</a>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Fecha</th><th>Motivo</th><th>Estado</th><th>Min.</th><th>Coste</th><th>Paciente</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="c : ${pagina.content}">
                    <td th:text="${#temporals.format(c.fecha, 'dd/MM/yyyy')}"></td>
                    <td th:text="${c.motivoCita}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${c.estadoCita == 'Completada'} ? 'text-bg-success' :
                                              (${c.estadoCita == 'Cancelada'} ? 'text-bg-secondary' :
                                              (${c.estadoCita == 'Confirmada'} ? 'text-bg-info' : 'text-bg-warning'))"
                              th:text="${c.estadoCita}"></span>
                    </td>
                    <td th:text="${c.duracionMinutos}"></td>
                    <td th:text="${#numbers.formatDecimal(c.costoEstimado, 1, 2)} + ' €'"></td>
                    <td style="min-width: 230px;">
                        <!-- Con paciente: enlace + botón desasociar -->
                        <div th:if="${c.paciente != null}" class="d-flex align-items-center gap-2">
                            <a th:href="@{/pacientes/detalle/{id}(id=${c.paciente.idPaciente})}"
                               th:text="${c.paciente.nombreCompleto}" class="text-decoration-none"></a>
                            <form method="post" th:action="@{/citas/desasociar/{id}(id=${c.idCita})}">
                                <button class="btn btn-sm btn-outline-warning py-0" title="Desasociar">
                                    <i class="bi bi-link-45deg"></i></button>
                            </form>
                        </div>
                        <!-- Sin paciente: selector para asociar -->
                        <form th:if="${c.paciente == null}" method="post" class="d-flex gap-1"
                              th:action="@{/citas/asociar/{id}(id=${c.idCita})}">
                            <select name="pacienteId" class="form-select form-select-sm" required>
                                <option value="">Asociar a…</option>
                                <option th:each="p : ${pacientes}" th:value="${p.idPaciente}"
                                        th:text="${p.nombreCompleto}"></option>
                            </select>
                            <button class="btn btn-sm btn-outline-primary" title="Asociar"><i class="bi bi-link"></i></button>
                        </form>
                    </td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-sm btn-outline-primary" title="Editar"
                           th:href="@{/citas/editar/{id}(id=${c.idCita})}"><i class="bi bi-pencil"></i></a>
                        <button type="button" class="btn btn-sm btn-outline-danger" title="Eliminar"
                                data-bs-toggle="modal" data-bs-target="#confirmModal"
                                th:data-href="@{/citas/eliminar/{id}(id=${c.idCita})}"
                                th:data-msg="|¿Eliminar la cita '${c.motivoCita}'?|">
                            <i class="bi bi-trash"></i></button>
                    </td>
                </tr>
                <tr th:if="${pagina.empty}">
                    <td colspan="7" class="text-center text-muted py-4">No hay citas todavía.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="small text-muted" th:text="|${pagina.totalElements} citas en total|"></span>
            <div th:replace="~{fragments/menu :: paginacion(${pagina}, '/citas')}"></div>
            <form th:replace="~{fragments/menu :: tamano(${pagina}, '/citas')}"></form>
        </div>
    </div>

    <!-- ===== Borrados masivos ===== -->
    <div class="card border-danger shadow-sm mb-5">
        <div class="card-header bg-danger text-white"><i class="bi bi-trash3"></i> Limpieza de citas</div>
        <div class="card-body">
            <div class="row g-4">
                <div class="col-md-6">
                    <form id="formCanceladas" method="post" th:action="@{/citas/limpiar/canceladas}">
                        <label class="form-label">Eliminar citas <b>canceladas</b> anteriores a:</label>
                        <div class="input-group">
                            <input type="date" name="fecha" class="form-control" required>
                            <button type="button" class="btn btn-outline-danger"
                                    data-bs-toggle="modal" data-bs-target="#confirmModal" data-form="formCanceladas"
                                    data-msg="Se eliminarán todas las citas canceladas anteriores a la fecha indicada. ¿Continuar?">
                                Eliminar</button>
                        </div>
                    </form>
                </div>
                <div class="col-md-6">
                    <form id="formHuerfanas" method="post" th:action="@{/citas/limpiar/huerfanas}">
                        <label class="form-label">Eliminar citas <b>sin paciente</b> con estado:</label>
                        <div class="input-group">
                            <select name="estado" class="form-select" required>
                                <option th:each="e : ${estados}" th:value="${e}" th:text="${e}"></option>
                            </select>
                            <button type="button" class="btn btn-outline-danger"
                                    data-bs-toggle="modal" data-bs-target="#confirmModal" data-form="formHuerfanas"
                                    data-msg="Se eliminarán todas las citas sin paciente con el estado elegido. ¿Continuar?">
                                Eliminar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{fragments/menu :: scripts}"></div>
</body>
</html>
