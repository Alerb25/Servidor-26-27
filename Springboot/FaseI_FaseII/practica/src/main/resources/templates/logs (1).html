<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu :: head('Logs')}"></head>
<body>
<nav th:replace="~{fragments/menu :: navbar('logs')}"></nav>
<div class="container">
    <h2 class="mb-3"><i class="bi bi-journal-text"></i> Registro de actividad</h2>

    <div class="card shadow-sm mb-5">
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-light">
                <tr><th>Fecha y hora</th><th>Acción</th><th>Entidad</th><th>ID</th><th>Detalle</th></tr>
                </thead>
                <tbody>
                <tr th:each="l : ${pagina.content}">
                    <td class="text-nowrap" th:text="${#temporals.format(l.fechaHora, 'dd/MM/yyyy HH:mm:ss')}"></td>
                    <td><span class="badge"
                              th:classappend="${l.accion == 'CREAR'} ? 'text-bg-success' :
                                              (${l.accion == 'ELIMINAR'} ? 'text-bg-danger' : 'text-bg-warning')"
                              th:text="${l.accion}"></span></td>
                    <td th:text="${l.entidad}"></td>
                    <td th:text="${l.idEntidad}"></td>
                    <td th:text="${l.detalle}"></td>
                </tr>
                <tr th:if="${pagina.empty}"><td colspan="5" class="text-center text-muted py-4">Aún no hay actividad registrada.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center flex-wrap gap-2">
            <span class="small text-muted" th:text="|${pagina.totalElements} registros|"></span>
            <div th:replace="~{fragments/menu :: paginacion(${pagina}, '/logs')}"></div>
            <form th:replace="~{fragments/menu :: tamano(${pagina}, '/logs')}"></form>
        </div>
    </div>
</div>
<div th:replace="~{fragments/menu :: scripts}"></div>
</body>
</html>
